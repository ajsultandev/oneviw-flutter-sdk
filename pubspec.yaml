name: oneviw_flutter_sdk
description: OneViw analytics & product-insights SDK for Flutter — events, feature flags, session replay, and more.
version: 1.0.1
homepage: https://1viw.com

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.10.0
  posthog_flutter: ^5.26.0
  android_play_install_referrer: ^0.4.0
  app_links: ^6.3.0
  shared_preferences: ^2.3.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.oneviw.oneviw_flutter_sdk
        pluginClass: OneviwFlutterSdkPlugin
      ios:
        pluginClass: OneviwFlutterSdkPlugin
